<!--
  Source artwork for the app icon (full-bleed square, no rounded corners).
  The ball sits inside the central 80% so it survives the circular "maskable" crop on Android.
  The PNG icons in public/icons/ were rendered from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="ball"><circle cx="256" cy="256" r="170"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#0d1117"/>
  <circle cx="256" cy="256" r="170" fill="#d4e600"/>
  <g clip-path="url(#ball)" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <path d="M 96 140 C 210 215 210 297 96 372"/>
    <path d="M 416 140 C 302 215 302 297 416 372"/>
  </g>
</svg>
